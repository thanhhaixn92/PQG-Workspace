[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes-local-stack"
version = "0.1.0"
description = "Hermes Local Stack - local-first AI office assistant backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "aiosqlite>=0.20.0",
    "pydantic-settings>=2.2.0",
    "agent-client-protocol==0.10.1",
    "sse-starlette==3.4.5",
    "mcp>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
