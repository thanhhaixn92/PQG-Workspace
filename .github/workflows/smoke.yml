name: Smoke Test

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

env:
  HERMES_DEV_MOCK: "1"
  HERMES_AUTH_READY: "1"

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run backend tests
        run: |
          pytest -v --tb=short

      - name: Start backend server
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          sleep 3

      - name: Verify health endpoint
        run: |
          curl -sf http://127.0.0.1:8000/health | python -c "import sys,json; d=json.load(sys.stdin); assert d['status']=='ok'"

      - name: Verify runtime status
        run: |
          curl -sf http://127.0.0.1:8000/api/runtime/status | python -c "import sys,json; d=json.load(sys.stdin); assert d['backend']=='ok'; assert d['hermes']['status']=='mock'"

      - name: Smoke test — create session + submit prompt
        run: |
          python -c "
import httpx, json, time

base = 'http://127.0.0.1:8000'

# Create session
r = httpx.post(f'{base}/api/sessions', json={'title': 'Smoke Test CI'})
assert r.status_code == 201, r.text
sid = r.json()['id']

# Submit prompt
r = httpx.post(f'{base}/api/sessions/{sid}/prompt', json={'prompt': 'Xin chào'})
assert r.status_code == 202, r.text
task_id = r.json()['id']

# Read SSE stream until done
with httpx.stream('GET', f'{base}/api/sessions/{sid}/events', timeout=15) as sse:
    for line in sse.iter_lines():
        if line.startswith('event: done') or line.startswith('event: error'):
            break

# Verify task completed
time.sleep(0.5)
r = httpx.get(f'{base}/api/sessions/{sid}/task-runs/latest')
assert r.status_code == 200
task = r.json()
assert task['status'] == 'completed', f'Expected completed, got {task}'

# Verify messages
r = httpx.get(f'{base}/api/sessions/{sid}/messages')
msgs = r.json()
assert len(msgs) == 2
assert msgs[0]['role'] == 'user'
assert msgs[1]['role'] == 'assistant'
print(f'SMOKE OK — {len(msgs)} messages, task {task[\"status\"]}')
"

      - name: Cleanup smoke test sessions
        run: |
          curl -s -X POST http://127.0.0.1:8000/api/sessions/cleanup-smoke-tests

  smoke-real:
    if: github.event_name == 'workflow_dispatch' && vars.HERMES_REAL_CI == '1'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        run: |
          pip install -e ".[dev]"

      - name: Setup Hermes
        run: |
          pip install hermes-agent
          hermes auth --provider "${{ secrets.HERMES_PROVIDER }}" --api-key "${{ secrets.HERMES_API_KEY }}"

      - name: Start backend server (real Hermes)
        run: |
          HERMES_DEV_MOCK=0 HERMES_EXECUTABLE_PATH=hermes HERMES_ARGS=acp \
            uvicorn app.main:app --host 127.0.0.1 --port 8001 &
          sleep 5

      - name: Smoke test with real Hermes
        run: |
          python -c "
import httpx, json, time

base = 'http://127.0.0.1:8001'

# Check preflight
r = httpx.get(f'{base}/api/runtime/status')
hermes = r.json()['hermes']
assert hermes['status'] == 'ready' or hermes['status'] == 'auth_expired', f'Expected ready/auth_expired, got {hermes[\"status\"]}'
print(f'Hermes status: {hermes[\"status\"]}, auth: {hermes[\"auth_status\"]}')

if hermes['status'] != 'ready':
    print('SKIP: Hermes not ready — auth may need manual setup')
    exit(0)

# Create session
r = httpx.post(f'{base}/api/sessions', json={'title': 'CI Real Hermes Smoke'})
sid = r.json()['id']

# Submit prompt
r = httpx.post(f'{base}/api/sessions/{sid}/prompt', json={'prompt': 'Trả lời ngắn gọn: 2+2 bằng mấy?'})
assert r.status_code == 202
task_id = r.json()['id']

# Read SSE
with httpx.stream('GET', f'{base}/api/sessions/{sid}/events', timeout=60) as sse:
    for line in sse.iter_lines():
        if 'done' in line or 'error' in line:
            break

time.sleep(1)
r = httpx.get(f'{base}/api/sessions/{sid}/task-runs/latest')
task = r.json()
assert task['status'] == 'completed', f'Expected completed, got {task}'

r = httpx.get(f'{base}/api/sessions/{sid}/messages')
msgs = r.json()
print(f'REAL SMOKE OK — {len(msgs)} messages')
for m in msgs:
    print(f'  [{m[\"role\"]}] {m[\"content\"][:100]}')
"
