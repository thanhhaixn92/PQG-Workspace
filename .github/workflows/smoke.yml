name: Smoke Test

on:
  pull_request:
    branches:
      - pqg-workspace
  push:
    branches:
      - pqg-workspace
      - 'work/**'
      - 'security/**'
      - 'maintenance/**'
      - 'integration/**'
  workflow_dispatch:

env:
  HERMES_DEV_MOCK: "1"
  HERMES_AUTH_READY: "1"

permissions:
  actions: read
  contents: read
  statuses: write

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.gate.outputs.mode }}
      reason: ${{ steps.gate.outputs.reason }}
      anchor_sha: ${{ steps.gate.outputs.anchor_sha }}
      predecessor_sha: ${{ steps.gate.outputs.predecessor_sha }}
      tracking_depth: ${{ steps.gate.outputs.tracking_depth }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 4

      - name: Publish pqg/smoke pending status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -sS \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"pending\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\",\"description\":\"PQG smoke validation is running\",\"context\":\"pqg/smoke\"}"

      - name: Validate committed diff formatting
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          zero_sha="0000000000000000000000000000000000000000"
          if [[ "${EVENT_NAME}" == "pull_request" && -n "${PR_BASE_SHA}" ]]; then
            git -C "${GITHUB_WORKSPACE}" fetch --no-tags --depth=1 origin "${PR_BASE_SHA}"
            git -C "${GITHUB_WORKSPACE}" diff --check "${PR_BASE_SHA}" "${GITHUB_SHA}"
          elif [[ "${EVENT_NAME}" == "push" && -n "${BEFORE_SHA}" && "${BEFORE_SHA}" != "${zero_sha}" ]]; then
            # Preserve first-parent ancestry for the bounded T1/T2 classifier.
            # `--depth=1` would make BEFORE_SHA shallow and misclassify T2 as T1.
            git -C "${GITHUB_WORKSPACE}" fetch --no-tags --deepen=4 origin "${BEFORE_SHA}"
            git -C "${GITHUB_WORKSPACE}" diff --check "${BEFORE_SHA}" "${GITHUB_SHA}"
          elif [[ "${EVENT_NAME}" == "push" && "${BEFORE_SHA}" == "${zero_sha}" ]]; then
            git -C "${GITHUB_WORKSPACE}" fetch --no-tags --deepen=1 origin "${GITHUB_REF_NAME}"
            parent_sha="$(git -C "${GITHUB_WORKSPACE}" rev-parse "${GITHUB_SHA}^")"
            git -C "${GITHUB_WORKSPACE}" diff --check "${parent_sha}" "${GITHUB_SHA}"
          else
            git -C "${GITHUB_WORKSPACE}" show --check --oneline --no-renames "${GITHUB_SHA}"
          fi

      - name: Classify full versus tracking validation
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          python scripts/ci/smoke_tracking_gate.py classify \
            --event-name "${EVENT_NAME}" \
            --ref-name "${REF_NAME}" \
            --before-sha "${BEFORE_SHA:-}" \
            --head-sha "${GITHUB_SHA}" \
            --github-output "${GITHUB_OUTPUT}"

  smoke-full:
    needs: classify
    if: needs.classify.outputs.mode == 'full'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Publish pqg/smoke-full pending status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -sS \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"pending\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\",\"description\":\"PQG full runtime smoke is running\",\"context\":\"pqg/smoke-full\"}"

      - name: Setup Python 3.11
        uses: actions/setup-python@9191ea1a55b1e7028943ee5647bf579e1182b42d # post-v7.0.0 security fix, PR #1350
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade -c constraints-ci.txt pip
          python -m pip --version | grep -Eq '^pip 26\.2\.1 '
          python -m pip install --help | grep -Fq -- '--build-constraint'
          python -m pip install \
            -c constraints-ci.txt \
            --build-constraint constraints-ci.txt \
            -e ".[dev]"
          python -m pip check

      - name: Validate backend constraints authority
        run: python ../scripts/ci/validate_backend_constraints.py

      - name: Run backend tests with skip reasons
        run: |
          pytest -v -ra --tb=short

      - name: Setup Node 24.16.0
        uses: actions/setup-node@1acbd4c02f0ca4d959e23850ad70c50828476634 # post-v7.0.0 security-fixed descendant
        with:
          node-version: "24.16.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate full frontend regression
        working-directory: frontend
        run: |
          node --version
          npm --version
          npm ci
          npm run test
          npm run lint
          npm run type-check
          npm run build

      - name: Start backend server
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          sleep 3

      - name: Verify health endpoint
        run: |
          curl -sf http://127.0.0.1:8000/health | python -c "import sys,json; d=json.load(sys.stdin); assert d['status']=='ok'"

      - name: Verify runtime status
        run: |
          curl -sf http://127.0.0.1:8000/api/runtime/status | python -c "import sys,json; d=json.load(sys.stdin); assert d['backend']=='ok'; assert d['hermes']['status']=='mock'"

      - name: Smoke test — create session + runtime readiness
        run: |
          python - <<'PY'
          import httpx

          base = "http://127.0.0.1:8000"

          # Create a managed local session so workspace readiness is exercised.
          response = httpx.post(f"{base}/api/sessions", json={"title": "Smoke Test CI"})
          assert response.status_code == 201, response.text
          session_id = response.json()["id"]

          # Use the current provider-independent runtime smoke contract. This
          # validates local readiness without pretending a model is configured.
          response = httpx.post(
              f"{base}/api/runtime/smoke",
              json={"session_id": session_id},
          )
          assert response.status_code == 200, response.text
          checks = {item["key"]: item for item in response.json()["checks"]}

          required_ready = {"backend", "db", "hermes", "sse", "workspace", "memory_approval"}
          missing = required_ready - checks.keys()
          assert not missing, f"Missing smoke checks: {sorted(missing)}"
          failures = {
              key: checks[key]
              for key in required_ready
              if checks[key]["status"] != "ready"
          }
          assert not failures, f"Runtime smoke not ready: {failures}"
          assert checks["n8n"]["status"] in {"ready", "skipped"}, checks["n8n"]

          # The readiness smoke must not synthesize model/chat output.
          response = httpx.get(f"{base}/api/sessions/{session_id}/messages")
          assert response.status_code == 200, response.text
          assert response.json() == []

          print(f"SMOKE OK — {len(checks)} readiness checks, workspace ready")
          PY

      - name: Cleanup smoke test sessions
        run: |
          python - <<'PY'
          import httpx

          base = "http://127.0.0.1:8000"
          preview = httpx.get(f"{base}/api/sessions/cleanup-smoke-tests/preview")
          assert preview.status_code == 200, preview.text
          payload = preview.json()
          token = payload.get("confirmation_token")
          assert isinstance(token, str) and token, payload

          response = httpx.post(
              f"{base}/api/sessions/cleanup-smoke-tests",
              json={"confirmation_token": token},
          )
          assert response.status_code == 200, response.text
          archived_count = response.json().get("archived_count")
          assert isinstance(archived_count, int) and archived_count >= 1, response.text
          print(f"CLEANUP OK — archived {archived_count} smoke session(s)")
          PY

      - name: Publish pqg/smoke-full final status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          case "${JOB_STATUS}" in
            success) state="success"; description="PQG full runtime smoke passed" ;;
            failure) state="failure"; description="PQG full runtime smoke failed" ;;
            *) state="error"; description="PQG full runtime smoke did not complete" ;;
          esac
          curl --fail-with-body -sS \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"${state}\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\",\"description\":\"${description}\",\"context\":\"pqg/smoke-full\"}"

  tracking-integrity:
    needs: classify
    if: needs.classify.outputs.mode == 'tracking'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Publish pqg/tracking-integrity pending status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -sS \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"pending\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\",\"description\":\"PQG tracking integrity is running\",\"context\":\"pqg/tracking-integrity\"}"

      - name: Select full-runtime receipt on validation anchor
        id: anchor-receipt
        env:
          GH_TOKEN: ${{ github.token }}
          ANCHOR_SHA: ${{ needs.classify.outputs.anchor_sha }}
        run: |
          curl --fail-with-body -sS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${ANCHOR_SHA}/status?per_page=100" \
            > "${RUNNER_TEMP}/anchor-status.json"
          python scripts/ci/smoke_tracking_gate.py select-receipt \
            --payload "${RUNNER_TEMP}/anchor-status.json" \
            --repository "${GITHUB_REPOSITORY}" \
            --expected-sha "${ANCHOR_SHA}" \
            --kind full \
            --github-output "${GITHUB_OUTPUT}"

      - name: Verify full-runtime Actions provenance on validation anchor
        env:
          GH_TOKEN: ${{ github.token }}
          ANCHOR_SHA: ${{ needs.classify.outputs.anchor_sha }}
          RUN_ID: ${{ steps.anchor-receipt.outputs.run_id }}
        run: |
          curl --fail-with-body -sS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" \
            > "${RUNNER_TEMP}/anchor-run.json"
          curl --fail-with-body -sS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" \
            > "${RUNNER_TEMP}/anchor-jobs.json"
          python scripts/ci/smoke_tracking_gate.py verify-run \
            --run-payload "${RUNNER_TEMP}/anchor-run.json" \
            --jobs-payload "${RUNNER_TEMP}/anchor-jobs.json" \
            --repository "${GITHUB_REPOSITORY}" \
            --expected-sha "${ANCHOR_SHA}" \
            --shape full

      - name: Select predecessor tracking receipt for depth two
        if: needs.classify.outputs.tracking_depth == '2'
        id: predecessor-receipt
        env:
          GH_TOKEN: ${{ github.token }}
          PREDECESSOR_SHA: ${{ needs.classify.outputs.predecessor_sha }}
        run: |
          curl --fail-with-body -sS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${PREDECESSOR_SHA}/status?per_page=100" \
            > "${RUNNER_TEMP}/predecessor-status.json"
          python scripts/ci/smoke_tracking_gate.py select-receipt \
            --payload "${RUNNER_TEMP}/predecessor-status.json" \
            --repository "${GITHUB_REPOSITORY}" \
            --expected-sha "${PREDECESSOR_SHA}" \
            --kind tracking \
            --github-output "${GITHUB_OUTPUT}"

      - name: Verify predecessor tracking Actions provenance for depth two
        if: needs.classify.outputs.tracking_depth == '2'
        env:
          GH_TOKEN: ${{ github.token }}
          PREDECESSOR_SHA: ${{ needs.classify.outputs.predecessor_sha }}
          RUN_ID: ${{ steps.predecessor-receipt.outputs.run_id }}
        run: |
          curl --fail-with-body -sS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" \
            > "${RUNNER_TEMP}/predecessor-run.json"
          curl --fail-with-body -sS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" \
            > "${RUNNER_TEMP}/predecessor-jobs.json"
          python scripts/ci/smoke_tracking_gate.py verify-run \
            --run-payload "${RUNNER_TEMP}/predecessor-run.json" \
            --jobs-payload "${RUNNER_TEMP}/predecessor-jobs.json" \
            --repository "${GITHUB_REPOSITORY}" \
            --expected-sha "${PREDECESSOR_SHA}" \
            --shape tracking

      - name: Publish pqg/tracking-integrity final status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          case "${JOB_STATUS}" in
            success) state="success"; description="PQG tracking equivalence verified" ;;
            failure) state="failure"; description="PQG tracking integrity failed" ;;
            *) state="error"; description="PQG tracking integrity did not complete" ;;
          esac
          curl --fail-with-body -sS \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"${state}\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\",\"description\":\"${description}\",\"context\":\"pqg/tracking-integrity\"}"

  smoke-result:
    needs:
      - classify
      - smoke-full
      - tracking-integrity
    if: always()
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve final pqg/smoke result
        id: result
        env:
          MODE: ${{ needs.classify.outputs.mode }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          FULL_RESULT: ${{ needs.smoke-full.result }}
          TRACKING_RESULT: ${{ needs.tracking-integrity.result }}
        run: |
          python scripts/ci/smoke_tracking_gate.py decide-final \
            --mode "${MODE}" \
            --classify-result "${CLASSIFY_RESULT}" \
            --full-result "${FULL_RESULT}" \
            --tracking-result "${TRACKING_RESULT}" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Publish final pqg/smoke status
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ steps.result.outputs.state }}
          DESCRIPTION: ${{ steps.result.outputs.description }}
        run: |
          curl --fail-with-body -sS \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"${STATE}\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\",\"description\":\"${DESCRIPTION}\",\"context\":\"pqg/smoke\"}"

          [[ "${STATE}" == "success" ]]

  smoke-real:
    if: github.event_name == 'workflow_dispatch' && vars.HERMES_REAL_CI == '1'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python 3.11
        uses: actions/setup-python@9191ea1a55b1e7028943ee5647bf579e1182b42d # post-v7.0.0 security fix, PR #1350
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        run: |
          pip install -e ".[dev]"

      - name: Setup Hermes
        run: |
          pip install hermes-agent
          hermes auth --provider "${{ secrets.HERMES_PROVIDER }}" --api-key "${{ secrets.HERMES_API_KEY }}"

      - name: Start backend server (real Hermes)
        run: |
          HERMES_DEV_MOCK=0 HERMES_EXECUTABLE_PATH=hermes HERMES_ARGS=acp \
            uvicorn app.main:app --host 127.0.0.1 --port 8001 &
          sleep 5

      - name: Smoke test with real Hermes
        run: |
          python - <<'PY'
          import httpx
          import time

          base = "http://127.0.0.1:8001"

          # Check preflight
          response = httpx.get(f"{base}/api/runtime/status")
          hermes = response.json()["hermes"]
          assert hermes["status"] in {"ready", "auth_expired"}, (
              f"Expected ready/auth_expired, got {hermes['status']}"
          )
          print(f"Hermes status: {hermes['status']}, auth: {hermes['auth_status']}")

          if hermes["status"] != "ready":
              print("SKIP: Hermes not ready — auth may need manual setup")
              raise SystemExit(0)

          # Create session
          response = httpx.post(
              f"{base}/api/sessions",
              json={"title": "CI Real Hermes Smoke"},
          )
          assert response.status_code == 201, response.text
          session_id = response.json()["id"]

          # Submit prompt
          response = httpx.post(
              f"{base}/api/sessions/{session_id}/prompt",
              json={"prompt": "Trả lời ngắn gọn: 2+2 bằng mấy?"},
          )
          assert response.status_code == 202, response.text

          # Read SSE
          with httpx.stream(
              "GET",
              f"{base}/api/sessions/{session_id}/events",
              timeout=60,
          ) as stream:
              for line in stream.iter_lines():
                  if "done" in line or "error" in line:
                      break

          time.sleep(1)
          response = httpx.get(f"{base}/api/sessions/{session_id}/task-runs/latest")
          task = response.json()
          assert task["status"] == "completed", f"Expected completed, got {task}"

          response = httpx.get(f"{base}/api/sessions/{session_id}/messages")
          messages = response.json()
          print(f"REAL SMOKE OK — {len(messages)} messages")
          for message in messages:
              print(f"  [{message['role']}] {message['content'][:100]}")
          PY
