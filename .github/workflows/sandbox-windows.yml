name: Sandbox Windows

on:
  push:
    branches:
      - pqg-workspace
      - 'security/**'
      - 'work/**'
    paths:
      - '.github/workflows/sandbox-windows.yml'
      - 'backend/app/services/sandbox_io.py'
      - 'backend/app/services/sandbox_io_windows.py'
      - 'backend/app/services/security_*.py'
      - 'backend/app/mcp/server.py'
      - 'backend/constraints-ci.txt'
      - 'backend/pyproject.toml'
      - 'backend/tests/test_sandbox_io_b.py'
      - 'scripts/ci/validate_backend_constraints.py'
  pull_request:
    branches:
      - pqg-workspace
    paths:
      - '.github/workflows/sandbox-windows.yml'
      - 'backend/app/services/sandbox_io.py'
      - 'backend/app/services/sandbox_io_windows.py'
      - 'backend/app/services/security_*.py'
      - 'backend/app/mcp/server.py'
      - 'backend/constraints-ci.txt'
      - 'backend/pyproject.toml'
      - 'backend/tests/test_sandbox_io_b.py'
      - 'scripts/ci/validate_backend_constraints.py'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  hostile-swap:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Publish pqg/sandbox-windows pending status
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $env:GH_TOKEN"
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $body = @{
            state = 'pending'
            target_url = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            description = 'PQG Windows sandbox validation is running'
            context = 'pqg/sandbox-windows'
          } | ConvertTo-Json -Compress
          Invoke-RestMethod -Method Post -Headers $headers -ContentType 'application/json' -Body $body -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/statuses/$env:GITHUB_SHA"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install backend dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade -c constraints-ci.txt pip
          $pipVersion = python -m pip --version
          if ($pipVersion -notmatch '^pip 26\.2\.1 ') {
            throw "Expected pip 26.2.1 after constrained bootstrap; got: $pipVersion"
          }
          if (-not ((python -m pip install --help) -match '--build-constraint')) {
            throw 'pip 26.2.1 capability check failed: --build-constraint is unavailable'
          }
          python -m pip install -c constraints-ci.txt --build-constraint constraints-ci.txt -e ".[dev]"
          python -m pip check

      - name: Validate backend constraints authority
        run: python ../scripts/ci/validate_backend_constraints.py

      - name: Run Package B Windows hostile-swap suite
        run: python -m pytest -v -ra --tb=short tests/test_sandbox_io_b.py

      - name: Publish pqg/sandbox-windows final status
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if ($env:JOB_STATUS -eq 'success') {
            $state = 'success'
            $description = 'PQG Windows sandbox validation passed'
          } elseif ($env:JOB_STATUS -eq 'failure') {
            $state = 'failure'
            $description = 'PQG Windows sandbox validation failed'
          } else {
            $state = 'error'
            $description = 'PQG Windows sandbox validation did not complete'
          }
          $headers = @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $env:GH_TOKEN"
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $body = @{
            state = $state
            target_url = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            description = $description
            context = 'pqg/sandbox-windows'
          } | ConvertTo-Json -Compress
          Invoke-RestMethod -Method Post -Headers $headers -ContentType 'application/json' -Body $body -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/statuses/$env:GITHUB_SHA"
